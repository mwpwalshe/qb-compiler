name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ising]"
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Typecheck on the OLDEST supported interpreter, matching requires-python and
          # tool.mypy python_version. Two reasons. It actually validates the declared floor,
          # which checking on 3.12 does not. And mypy resolves third-party stubs from the
          # running interpreter, so a newer stub written with syntax the target version lacks
          # is reported as an error in that stub: on 3.12, numpy ships PEP 695 `type`
          # statements that mypy rejects while targeting 3.10. Keep this pin and
          # tool.mypy python_version in step.
          python-version: "3.10"
      - run: pip install -e ".[dev,ising]"
      - name: mypy
        run: mypy src/qb_compiler/

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        qiskit-version: ["1.4", "2.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev,ising]"
      - name: Pin Qiskit ${{ matrix.qiskit-version }}
        run: pip install "qiskit~=${{ matrix.qiskit-version }}.0"
      - name: Run tests
        run: |
          pytest tests/unit -v \
            --timeout=30 \
            --cov=src/qb_compiler \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.qiskit-version == '2.0'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
